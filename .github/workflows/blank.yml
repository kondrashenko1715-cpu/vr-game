name: Build VR APK Without Gradle
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-size: '20'

      - name: Extract user archive
        run: unzip MyHTMLApp_APK_Project.zip -d web_files

      - name: Install Google Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Initialize WebAPK Project
        run: |
          # Создаем легкие настройки приложения без Android Studio и Gradle
          mkdir -p apk_project
          
          # Находим ваш файл игры и кладем его в корень веб-папки
          find web_files -name "index.html" -exec cp {} apk_project/index.html \;
          
          cd apk_project
          
          # Генерируем специальный манифест, чтобы шлем Pico 4 видел сайт как игру
          cat << 'EOF' > manifest.json
          {
            "name": "Pico4 Cube Game",
            "short_name": "PicoCube",
            "start_url": "./index.html",
            "display": "standalone",
            "orientation": "landscape",
            "background_color": "#111111",
            "theme_color": "#FF9500",
            "icons": [
              {
                "src": "https://aframe.io",
                "sizes": "128x128",
                "type": "image/png"
              }
            ]
          }
          EOF

      - name: Build Final APK
        run: |
          cd apk_project
          # Запускаем сборку легкого APK-пакета напрямую через инструменты Google
          bubblewrap init --manifest=manifest.json --meta-check=false
          bubblewrap build --skipSigning=true
          
          # Переносим готовый файл для выгрузки
          mkdir -p ../output_apk
          cp *.apk ../output_apk/app-release-unsigned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vr-game-apk
          path: output_apk/app-release-unsigned.apk
