name: Build VR APK Final
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract user archive
        run: |
          unzip MyHTMLApp_APK_Project.zip -d web_files
          mkdir -p final_app/assets
          find web_files -name "index.html" -exec cp {} final_app/assets/index.html \;

      - name: Build APK via Native Android Tools
        run: |
          mkdir -p build_dir output_apk
          
          AAPT2_PATH=$(find ${ANDROID_HOME}/build-tools -name aapt2 | sort -V | tail -n 1)
          ANDROID_JAR=$(find ${ANDROID_HOME}/platforms -name android.jar | sort -V | tail -n 1)
          
          echo "Используем aapt2 по пути: $AAPT2_PATH"
          echo "Используем платформу: $ANDROID_JAR"
          
          cd final_app
          
          # ИСПРАВЛЕНО: Добавлены обязательные атрибуты android:name для всех тегов
          cat << 'EOF' > AndroidManifest.xml
          <manifest xmlns:android="http://android.com" package="com.myvrgame.cube" versionCode="1" versionName="1.0">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="PicoCube" android:hasCode="false" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name="android.app.Activity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          $AAPT2_PATH link --manifest AndroidManifest.xml -I $ANDROID_JAR -A assets -o ../output_apk/app-debug.apk --java ../build_dir

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vr-game-apk
          path: output_apk/app-debug.apk
