name: Build VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Unzip project
        run: unzip MyHTMLApp_APK_Project.zip -d project_files

      - name: Build APK with Gradle
        run: |
          # Ищем, в какую именно подпапку распаковался проект
          GRADLEW_PATH=$(find project_files -name gradlew)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          
          echo "Проект найден в папке: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Даем права на запуск и собираем APK
          chmod +x gradlew
          ./gradlew assembleDebug
          
          # Копируем готовый APK в надежное место для выгрузки
          mkdir -p ../../output_apk
          cp app/build/outputs/apk/debug/*.apk ../../output_apk/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vr-game-apk
          path: output_apk/app-debug.apk
