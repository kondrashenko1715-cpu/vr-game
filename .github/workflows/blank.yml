name: Build VR APK Final
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract user archive
        run: |
          unzip MyHTMLApp_APK_Project.zip -d web_files
          mkdir -p final_web
          find web_files -name "index.html" -exec cp {} final_web/index.html \;

      - name: Convert HTML to APK via Docker
        run: |
          mkdir -p output_apk
          # Используем официальный и всегда доступный Docker-сборщик веб-приложений
          docker run --rm -v ${{ github.workspace }}/final_web:/app/www -v ${{ github.workspace }}/output_apk:/app/output corporateld/cordova-build-android
          # На всякий случай проверяем и переименовываем файл для выгрузки
          mv output_apk/*.apk output_apk/app-debug.apk || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vr-game-apk
          path: output_apk/app-debug.apk
