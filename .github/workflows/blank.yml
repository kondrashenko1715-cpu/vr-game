name: Build VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Unzip project
        run: unzip MyHTMLApp_APK_Project.zip -d project_files

      - name: Сборка APK с помощью Gradle
        run: |
          cd project_files
          
          # Проверяем, есть ли gradlew в корне, если нет - даем ему права напрямую
          chmod +x ./gradlew
          
          # Запускаем сборку
          ./gradlew assembleDebug
          
          # Создаем папку для выгрузки и копируем APK
          mkdir -p ../output_apk
          cp app/build/outputs/apk/debug/*.apk ../output_apk/app-debug.apk

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: vr-game-apk
          path: output_apk/app-debug.apk
