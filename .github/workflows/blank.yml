name: Build VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Unzip project
        run: unzip MyHTMLApp_APK_Project.zip -d project_files

      - name: Build APK with Gradle
        run: |
          cd project_files
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vr-game-apk
          path: project_files/app/build/outputs/apk/debug/app-debug.apk
