name: Build VR APK Safe Version
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Unzip project files
        run: unzip MyHTMLApp_APK_Project.zip -d user_project

      - name: Initialize Android template
        run: |
          mkdir -p gradle_project/app/src/main/assets
          cd gradle_project
          gradle init --type basic --dsl groovy --overwrite
          find ../user_project -name "index.html" -exec cp {} app/src/main/assets/index.html \;
          
          # Создаем настройки проекта с указанием репозиториев Google для плагинов
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
          echo "include ':app'" >> settings.gradle
          
          # Создаем корневой файл build.gradle
          echo "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.1.0' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle
          
          # Создаем build.gradle для самого приложения
          echo "plugins { id 'com.android.application' }" > app/build.gradle
          echo "android { compileSdk 33; defaultConfig { applicationId 'com.myvrgame.cube'; minSdk 26; targetSdk 33 } }" >> app/build.gradle

      - name: Build APK with Gradle
        run: |
          cd gradle_project
          gradle wrapper
          chmod +x ./gradlew
          ./gradlew assembleDebug
          mkdir -p ../output_apk
          cp app/build/outputs/apk/debug/*.apk ../output_apk/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vr-game-apk
          path: output_apk/app-debug.apk
