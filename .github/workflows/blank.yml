name: Build VR APK New Way
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean server space
        run: rm -rf final_web output_apk web_files final_app

      - name: Extract user archive
        run: |
          unzip MyHTMLApp_APK_Project.zip -d web_files
          mkdir -p final_app/assets
          find web_files -name "index.html" -exec cp {} final_app/assets/index.html \;

      - name: Build APK via Java Ant Tools
        run: |
          mkdir -p output_apk
          cd final_app
          
          # Записываем манифест без двоеточий, чтобы Linux не ломал строку
          echo '<manifest XMLNS_placeholder="http://android.com" package="com.myvrgame.cube" versionCode="1" versionName="1.0">' > AndroidManifest.xml
          echo '    <application ANDROID_placeholder="PicoCube" HASCODE_placeholder="false">' >> AndroidManifest.xml
          echo '        <activity ANDROID_NAME_placeholder="android.app.Activity" EXPORTED_placeholder="true">' >> AndroidManifest.xml
          echo '            <intent-filter>' >> AndroidManifest.xml
          echo '                <action ANDROID_NAME_placeholder="android.intent.action.MAIN" />' >> AndroidManifest.xml
          echo '                <category ANDROID_NAME_placeholder="android.intent.category.LAUNCHER" />' >> AndroidManifest.xml
          echo '            </intent-filter>' >> AndroidManifest.xml
          echo '        </activity>' >> AndroidManifest.xml
          echo '    </application>' >> AndroidManifest.xml
          echo '</manifest>' >> AndroidManifest.xml
          
          # А теперь заменяем плейсхолдеры на настоящие системные атрибуты Android
          sed -i 's/XMLNS_placeholder/xmlns:android/g' AndroidManifest.xml
          sed -i 's/ANDROID_placeholder/android:label/g' AndroidManifest.xml
          sed -i 's/HASCODE_placeholder/android:hasCode/g' AndroidManifest.xml
          sed -i 's/ANDROID_NAME_placeholder/android:name/g' AndroidManifest.xml
          sed -i 's/EXPORTED_placeholder/android:exported/g' AndroidManifest.xml

          # Находим системные инструменты Android
          AAPT_PATH=$(find ${ANDROID_HOME}/build-tools -name aapt | sort -V | tail -n 1)
          ANDROID_JAR=$(find ${ANDROID_HOME}/platforms -name android.jar | sort -V | tail -n 1)
          
          # Собираем чистый APK
          $AAPT_PATH package -f -M AndroidManifest.xml -I $ANDROID_JAR -A assets -F ../output_apk/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vr-game-apk
          path: output_apk/app-debug.apk
