name: Build VR APK Free Version
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract user archive
        run: |
          unzip MyHTMLApp_APK_Project.zip -d web_files
          mkdir -p final_web
          find web_files -name "index.html" -exec cp {} final_web/index.html \;

      - name: Convert HTML to APK
        uses: Hrishikesh-Pathak/Html-To-Apk@v2.0.0
        with:
          html-folder-path: './final_web'
          app-name: 'PicoCube'
          package-name: 'com.myvrgame.cube'
          output-apk-path: './output_apk/app-debug.apk'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vr-game-apk
          path: output_apk/app-debug.apk
