name: Build VR APK New Way
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean server space
        run: rm -rf final_web output_apk web_files

      - name: Extract user archive
        run: |
          unzip MyHTMLApp_APK_Project.zip -d web_files
          mkdir -p final_web
          find web_files -name "index.html" -exec cp {} final_web/index.html \;

      - name: Convert HTML to APK via Simple Compiler
        run: |
          mkdir -p output_apk
          # Используем готовый и легкий Docker-паковщик веб-страниц
          docker run --rm -v ${{ github.workspace }}/final_web:/src -v ${{ github.workspace }}/output_apk: /dist ghcr.io/tech-engine/html-to-apk:latest
          # Проверяем и переименовываем готовый файл для выгрузки
          mv output_apk/*.apk output_apk/app-debug.apk || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vr-game-apk
          path: output_apk/app-debug.apk
